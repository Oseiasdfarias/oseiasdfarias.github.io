      tailwind.config = {
        darkMode: 'class',

          extend: {
            fontFamily: {
              sans:    ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono:    ['JetBrains Mono', 'monospace'],
              pixel:   ['"VT323"', 'monospace'],
            },
            colors: {
              /* ── Dark theme (minimal / charcoal) ─────────────── */
              navy:          '#111111',   /* near-black               */
              navyCard:      '#1a1a1a',   /* card surface             */
              navyHover:     '#222222',   /* hover state              */
              navyBorder:    '#2e2e2e',   /* subtle border            */
              accent:        '#c8a870',   /* gold discreto — único    */
              accent2:       '#a89070',   /* gold escuro — secundário */

              paperHover:    '#f0eeea',   /* hover state              */

    <!-- Google Fonts: Inter + Space Grotesk + JetBrains Mono + VT323 (pixel) -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">

    <style>
      /* ── Scanlines overlay (dark mode only) ─────────────────── */
      .dark .scanlines::after {
        content: '';
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 3px,
          rgba(0, 0, 0, 0.06) 3px,
          rgba(0, 0, 0, 0.06) 4px
        );
        pointer-events: none;
        z-index: 4;
      }

      /* ── Pixel offset shadow on card hover ──────────────────── */
      .pixel-card {
        transition: box-shadow 0.15s steps(2), border-color 0.15s steps(2), transform 0.15s steps(2);
      }
      .pixel-card:hover {
        box-shadow: 4px 4px 0px 0px #c8a870;
        transform: translate(-2px, -2px);
      }
      .pixel-card-indigo:hover {
        box-shadow: 4px 4px 0px 0px #a89070;
        transform: translate(-2px, -2px);
      }
      .light .pixel-card:hover,
      :not(.dark) .pixel-card:hover {
        box-shadow: 4px 4px 0px 0px #5a3a20;
      }
      .light .pixel-card-indigo:hover,
      :not(.dark) .pixel-card-indigo:hover {
        box-shadow: 4px 4px 0px 0px #2e7a62;
      }

      /* ── Blinking block cursor ──────────────────────────────── */
      @keyframes pixel-blink {
        0%, 49%  { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .pixel-cursor::after {
        content: '█';
        font-family: 'VT323', monospace;
        color: #c8a870;
        margin-left: 4px;
        animation: pixel-blink 1s step-end infinite;
        font-size: 0.9em;
      }

      /* ── Pixel dot pulse (nav active) ───────────────────────── */
      @keyframes pixel-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.3; }
      }
      .pixel-dot {
        animation: pixel-pulse 1.5s step-start infinite;
      }

      /* ── CRT vignette (dark mode only) ──────────────────────── */
      .dark .crt-vignette::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center,
          transparent 60%,
          rgba(0, 0, 0, 0.35) 100%
        );
        pointer-events: none;
        z-index: 3;
      }

      /* ── Pixel tag borders ───────────────────────────────────── */
      .tag-pixel {
        image-rendering: pixelated;
        clip-path: polygon(
          0 2px, 2px 2px, 2px 0,
          calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px,
          100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px),
          calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px),
          0 calc(100% - 2px)
        );
      }
    </style>
